<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>妖怪金手指</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #1d2740 0%, #0d1016 60%, #08090c 100%);
      color: #e6e8ee; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .box { width: 100%; max-width: 460px; text-align: center; }
    .icon {
      width: 74px; height: 74px; margin: 0 auto 22px; border-radius: 22px;
      background: linear-gradient(145deg, #2b3a5c, #161d2c); border: 1px solid #35466d;
      display: flex; align-items: center; justify-content: center; font-size: 34px;
    }
    h1 { font-size: 22px; margin: 0 0 12px; letter-spacing: .5px; }
    p { margin: 0 0 8px; color: #9aa3b5; font-size: 15px; line-height: 1.75; }
    .end { color: #6f9bff; font-size: 14px; }
    .hint { margin-top: 26px; font-size: 12px; color: #5c6478; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; margin-right: 6px; animation: b 1.4s infinite; }
    @keyframes b { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
    .loading { color: #5c6478; font-size: 13px; }
  </style>
</head>

<body>
  <div class="box" id="box">
    <div class="icon">🛠</div>
    <h1 id="title">正在进入游戏</h1>
    <p id="msg" class="loading"><span class="dot"></span>加载中…</p>
  </div>

  <script>
    // 入口先问一次维护状态：
    //  - 维护中：留在本页显示公告，绝不加载游戏
    //  - 正常：跳到 game.html（真正的游戏页面）
    (function () {
      var ADV = 30000;
      var box = document.getElementById('box');

      function showMaintenance(msg, end) {
        document.title = '服务器维护中';
        document.getElementById('title').textContent = '服务器维护中';
        var m = document.getElementById('msg');
        m.className = '';
        m.textContent = msg || '服务器维护中，请稍后再试';
        if (end > 0) {
          var d = new Date(end * 1000);
          var p = document.createElement('p');
          p.className = 'end';
          p.textContent = '预计恢复时间：' + d.getFullYear() + '-' +
            ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' +
            ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
          box.appendChild(p);
        }
        var h = document.createElement('p');
        h.className = 'hint';
        h.innerHTML = '<span class="dot"></span>本页 30 秒后自动刷新，维护结束后自动进入游戏';
        box.appendChild(h);
        setTimeout(function () { location.reload(); }, ADV);
      }

      function enter() {
        location.replace('game.html' + location.search);
      }

      function check() {
        var x = new XMLHttpRequest();
        x.open('GET', 'sy_api/maint.php?t=' + Date.now(), true);
        x.timeout = 8000;
        x.onloadend = function () {
          if (x.status !== 200) { enter(); return; }
          try {
            var j = JSON.parse(x.responseText);
            if (j && j.on) showMaintenance(j.msg, j.end);
            else enter();
          } catch (e) { enter(); }
        };
        x.send(null);
      }

      check();
    })();
  </script>
</body>

</html>

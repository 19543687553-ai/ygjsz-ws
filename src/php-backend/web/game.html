    (function () {
      var PHP_BIN = location.origin + '/sy_api/files.php?f=';
      var NAME = /((?:preload_)?config\.hunfu147127\.bin)/;
      function fix(u) {
        if (typeof u !== 'string') return u;
        var m = u.match(NAME);
        return m ? PHP_BIN + m[1] : u;
      }
      var xo = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (m, u) {
        arguments[1] = fix(u);
        return xo.apply(this, arguments);
      };
      if (window.fetch) {
        var of = window.fetch;
        window.fetch = function (input, init) {
          if (typeof input === 'string') return of.call(window, fix(input), init);
          if (input && input.url) return of.call(window, new Request(fix(input.url), input), init);
          return of.call(window, input, init);
        };
      }
    })();
  </script>

  <!-- 私服日志上报：抓控制台报错 + 统计哪些协议指令没有回包 -->
  <script>
    (function () {
      var URL = location.origin + "/sy_api/log.php";
      var buf = [], sending = false;

      // 资源脚本都走 CDN（带 allow-origin: *），加上 crossorigin 后
      // window.onerror 才能拿到完整堆栈，而不是只有 "Script error."
      try {
        var ce = document.createElement.bind(document);
        document.createElement = function (tag) {
          var el = ce(tag);
          if (String(tag).toLowerCase() === "script") {
            try { el.crossOrigin = "anonymous"; } catch (e) { }
          }
          return el;
        };
      } catch (e) { }
      function push(lv, m) {
        if (buf.length > 300) buf.shift();
        buf.push({ lv: lv, m: String(m).slice(0, 1500) });
      }
      function flush() {
        if (!buf.length || sending) return;
        sending = true;
        var body = JSON.stringify({ t: Date.now(), url: location.href, logs: buf.splice(0, 40) });
        var x = new XMLHttpRequest();
        x.open("POST", URL, true);
        x.setRequestHeader("Content-Type", "application/json");
        x.onloadend = function () { sending = false; };
        x.onerror = x.onloadend;
        try { x.send(body); } catch (e) { sending = false; }
      }
      setInterval(flush, 5000);
      window.addEventListener("beforeunload", flush);

      ["log", "warn", "error"].forEach(function (lv) {
        var old = console[lv];
        console[lv] = function () {
          try {
            var s = [];
            for (var i = 0; i < arguments.length; i++) {
              var a = arguments[i];
              if (typeof a === "string") s.push(a);
              else { try { s.push(JSON.stringify(a)); } catch (e) { s.push(String(a)); } }
            }
            push(lv, s.join(" "));
          } catch (e) { }
          try { old.apply(console, arguments); } catch (e) { }
        };
      });
      window.onerror = function (msg, src, line, col, err) {
        push("error", "[onerror] " + msg + " @" + (src || "").split("/").pop() + ":" + line + (err && err.stack ? " " + err.stack : ""));
      };
      window.addEventListener("unhandledrejection", function (e) {
        push("error", "[reject] " + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
      });

      // WebSocket 指令统计：发出去 8 秒没回包的记下来，方便定位哪个功能没人实现
      function hexOf(d) {
        if (typeof d === "string") return d;
        if (d && typeof d.byteLength === "number") {
          var u = new Uint8Array(d), s = "";
          for (var i = 0; i < Math.min(u.length, 9); i++) s += (u[i] < 16 ? "0" : "") + u[i].toString(16);
          return s;
        }
        return null;
      }
      var pending = {};
      var Native = window.WebSocket;
      if (Native) {
        function Wrapped(url, p) {
          var ws = p ? new Native(url, p) : new Native(url);
          ws.addEventListener("message", function (ev) {
            try {
              var h = hexOf(ev.data);
              if (h && h.length >= 18) {
                var mod = parseInt(h.substr(10, 2), 16);
                var cmd = parseInt(h.substr(12, 4), 16);
                delete pending[mod + "/" + (cmd - 1)];
              }
            } catch (e) { }
          });
          var raw = ws.send;
          ws.send = function (d) {
            try {
              var h = hexOf(d);
              if (h && h.length >= 12) {
                var mod = parseInt(h.substr(4, 2), 16);
                var cmd = parseInt(h.substr(6, 4), 16);
                pending[mod + "/" + cmd] = Date.now();
              }
            } catch (e) { }
            return raw.apply(ws, arguments);
          };
          return ws;
        }
        Wrapped.prototype = Native.prototype;
        ["CONNECTING", "OPEN", "CLOSING", "CLOSED"].forEach(function (k) { if (Native[k] !== undefined) Wrapped[k] = Native[k]; });
        window.WebSocket = Wrapped;
        setInterval(function () {
          var now = Date.now(), miss = [];
          for (var k in pending) {
            if (now - pending[k] > 8000) { miss.push(k); delete pending[k]; }
          }
          if (miss.length) push("warn", "[无回包] module/cmd " + miss.join(", "));
        }, 8000);
      }
    })();
  </script>

    function startFrameTimer() {

      }

    /**
     * @description: 帧响应
     */
    function frameHandler() {
      let passTime = this.getPassTime();
      if (passTime <= 0)
        return;

      if (!this._isDone) {
        let fakerLeftProgress = this.clamp(FixRate - this._progress, 0, 1);
        let speed = this.clamp(passTime * (fakerLeftProgress * FakerSpeed), 0, 1);

        this._progress += speed;
        this.updateProgress(this._progress);
      } else {
        this.funnyTipEnd();

        if (this._progress <= 1) {
          this._progress = 1;
          this.updateProgress(this._progress);
        }

        this._completeDelayTime -= passTime;
        if (this._completeDelayTime < 0) {
          this.stopProgress();
        }
      }
    }

    function updateProgress(rate) {
      rate = this.clamp(rate, 0, 1);
      let toRate = 100 * rate;
      lbar.style.width = toRate + "%";

      let pValue = Math.floor(rate * 10000)
      if (this._lastProgressValue != pValue) {
        this._lastProgressValue = pValue;
        pValue /= 100;
        let left = Math.floor(pValue);
        let right = Math.floor((left > 0 ? pValue % left : pValue) * 100);
        let leftStr = left.toString();
        let rigthStr = right.toString();
        while (leftStr.length < 2) {
          leftStr = "0" + leftStr;
        }
        while (rigthStr.length < 2) {
          rigthStr = rigthStr + "0";
        }
        loadingBarTips.innerHTML = this._curFunnyTip + "(" + leftStr + "." + rigthStr + "%)";
      }
    }

    function getNow() {

    function getPassTime() {
      if (this._lastTime <= 0) {
        this._lastTime = this.getNow();
        return 0;
      }

      let now = this.getNow();
      let passTime = now - this._lastTime;
      this._lastTime = now;

      return passTime;
    }

        $browser_id = 1;
      } else if (/MicroMessenger/.test(ua)) {
        //微信浏览器
        $browser_id = 2;
      } else if (/Chrome/.test(ua) || (/Android/.test(ua) && /Linux/.test(ua) && /Mobile Safari/.test(ua))) {
        //chrome 浏览器
        $browser_id = 5;
      } else if (/Safari/.test(ua)) {
        //safari 浏览器
        $browser_id = 6;
      } else if (/MSIE/.test(ua) && /Maxthon|The world|360SE|TencentTraveler|SE|Avant/.test(ua) == false) {
        //IE浏览器
        $browser_id = 4;
      } else if (/Android/.test(ua)) {
        //安卓原生浏览器
        $browser_id = 3;
      }
    }

  <!-- 私服兜底：只处理会卡住主界面的两个东西
       1) 离线收益弹窗（没有完整服务端数据时关不掉）
       2) 新手引导容器和残留的 dark 遮罩（会吞掉全屏点击）
       注意 1：绝不能按 "reward" 关键字大范围隐藏，抽卡/关卡结算的奖励窗名字里也有 reward，
               那样抽完卡会看不到结果，看起来就像“抽奖没反应”；
       注意 2：也不能用 "hangup" + "reward" 组合匹配 —— 抽卡结果窗里的奖励卡片节点就叫
               hangup_reward_comp / n_hangup_reward，一起隐藏会让奖励卡直接消失。
               所以这里只认窗口名 hangupoffline。 -->
  <script>
    (function () {
      var done = "";
      setInterval(function () {
        try {
          var cc = window.cc;
          if (!cc || !cc.director || !cc.director.getScene) return;
          var scene = cc.director.getScene();
          if (!scene) return;
          var hit = [];
          (function walk(n) {
            if (!n) return;
            var low = (n.name || "").toLowerCase();
            if (low.indexOf("hangupoffline") >= 0) {
              hit.push(n);
            }
            // Guide 是引导容器本身，只关子节点的话容器上的全屏拦截还在
            if (low === "guide" && n.active) n.active = false;
            // 孤立的 dark 遮罩（兄弟窗口都关了它还留着）会吞掉所有点击
            if (low === "dark" && n.active) {
              var p = n.parent, k = p ? (p.children || []) : [], alive = 0;
              for (var i = 0; i < k.length; i++) if (k[i] !== n && k[i].active) alive++;
              if (!alive) n.active = false;
            }
            var kids = n.children || [];
            for (var i = 0; i < kids.length; i++) walk(kids[i]);
          })(scene);
          // 只能隐藏，不能 destroy：客户端随后还会调用窗口上的方法，
          // 销毁后就是 "Cannot read properties of null (reading 'showHangUpReward')"
          for (var i = 0; i < hit.length; i++) {
            hit[i].active = false;
          }
          var names = hit.map(function (x) { return x.name; }).join(",");
          if (names && names !== done) {
            done = names;
            console.log("[私服] 已关闭卡住的弹窗: " + names);
          }
        } catch (e) { }
      }, 1200);
    })();
  </script>
